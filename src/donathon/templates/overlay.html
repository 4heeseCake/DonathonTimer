<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donathon Timer Overlay</title>
<style>
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
  body{color:#fff;font-family:Inter,"Segoe UI",Arial,sans-serif}
  .stage{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:18px 0;box-sizing:border-box}
  #interactive{display:none;max-width:min(980px,92vw);width:min(980px,92vw);box-sizing:border-box}
  #interactive.visible{display:block}
  #interactive{--ia:#6ee7ff;--ib:#9b7cff;--icard:rgba(8,14,25,.78);--itext:#fff}
  #interactive.theme-classic{--ia:#ffffff;--ib:#94a3b8;--icard:rgba(12,15,22,.72)}
  #interactive.theme-neon{--ia:#79f7ff;--ib:#bd83ff;--icard:rgba(24,18,45,.72)}
  #interactive.theme-minimal{--ia:#9cff57;--ib:#f9f871;--icard:rgba(18,24,30,.86)}
  #interactive.theme-retro{--ia:#ffd76a;--ib:#ffb84a;--icard:rgba(38,27,8,.78)}
  #interactive.theme-glass{--ia:#8ff7ff;--ib:#ffb7dc;--icard:rgba(26,24,42,.66)}
  #interactive.theme-cyber{--ia:#58f5ff;--ib:#f46de2;--icard:rgba(7,20,29,.80)}
  #interactive.theme-streamer{--ia:#8073ff;--ib:#cf56be;--icard:rgba(29,22,58,.72)}
  #interactive.theme-gaming{--ia:#f7d348;--ib:#e54858;--icard:rgba(24,20,18,.82)}
  #interactive.theme-elegant{--ia:#ff9bd6;--ib:#49e8ff;--icard:rgba(35,18,55,.78)}
  #interactive.theme-scoreboard{--ia:#ffea4d;--ib:#3bc9ff;--icard:rgba(17,19,26,.84)}
  .interactive-card{padding:20px 26px;border-radius:26px;background:linear-gradient(180deg, color-mix(in srgb,var(--icard) 92%, #ffffff 8%), var(--icard));color:var(--itext);backdrop-filter:blur(14px);box-shadow:0 18px 54px rgba(0,0,0,.42),0 0 30px color-mix(in srgb,var(--ia) 18%,transparent), inset 0 1px 0 rgba(255,255,255,.08);border:2px solid color-mix(in srgb,var(--ia) 82%, white 18%)}
  .interactive-title{text-align:center;color:var(--ia);font-size:clamp(22px,2.1vw,42px);font-weight:900;letter-spacing:.025em;margin-bottom:14px;text-shadow:0 3px 14px rgba(0,0,0,.72)}
  .poll-row{display:grid;grid-template-columns:minmax(140px,1fr) minmax(180px,2.5fr) auto;gap:12px;align-items:center;margin:9px 0}
  .poll-label{font-size:clamp(16px,1.25vw,27px);font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .poll-track{height:20px;background:rgba(255,255,255,.10);border-radius:999px;overflow:hidden}
  .poll-fill{height:100%;border-radius:999px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .poll-value{font-size:clamp(14px,1vw,22px);font-weight:800;min-width:110px;text-align:right}
  .poll-footer{text-align:center;margin-top:12px;opacity:.8;font-weight:700}
  .roulette-layout{display:grid;grid-template-columns:minmax(250px,390px) minmax(240px,1fr);gap:24px;align-items:center}
  .wheel-box{position:relative;width:min(34vw,370px);aspect-ratio:1/1;margin:auto;filter:drop-shadow(0 24px 34px rgba(0,0,0,.34))}
  .wheel-box::before{content:"";position:absolute;inset:-16px;border-radius:50%;background:radial-gradient(circle, color-mix(in srgb,var(--ia) 42%, transparent) 0%, transparent 70%);opacity:.7}
  #wheel-rotor{position:absolute;inset:0;will-change:transform;transform-origin:center center}
  #wheel{position:absolute;inset:0;border-radius:50%;background:#1f2937;box-shadow:0 0 0 10px rgba(255,255,255,.07), inset 0 0 0 2px rgba(255,255,255,.18), 0 16px 40px rgba(0,0,0,.45);}
  .wheel-pointer{position:absolute;z-index:4;left:50%;top:-16px;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:38px solid #fff;filter:drop-shadow(0 4px 6px rgba(0,0,0,.75))}
  .wheel-center{position:absolute;z-index:3;left:50%;top:50%;width:58px;height:58px;border-radius:50%;background:linear-gradient(180deg,#ffffff,#dbeafe);transform:translate(-50%,-50%);box-shadow:0 0 0 10px rgba(6,12,22,.72);display:grid;place-items:center;font-weight:900;color:#111827;letter-spacing:.08em}
  .wheel-labels{position:absolute;inset:0;z-index:2;pointer-events:none}
  .wheel-segment-label{position:absolute;left:50%;top:50%;width:82px;transform-origin:center center;text-align:center;font-weight:800;font-size:12px;line-height:1.05;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85);white-space:normal;word-break:break-word}
  .roulette-result-box{margin-top:8px;padding:10px 12px;border-radius:14px;background:rgba(9,14,24,.58);border:1px solid rgba(255,255,255,.1)}

  .roulette-side{min-width:0}
  .roulette-result{text-align:center;font-weight:950;font-size:clamp(22px,2vw,38px);margin:8px 0 14px;color:#fff;line-height:1.08;text-shadow:0 4px 18px rgba(0,0,0,.55)}
  .roulette-status{text-align:center;font-size:12px;font-weight:900;letter-spacing:.18em;opacity:.82;text-transform:uppercase}
  .roulette-list{display:flex;flex-direction:column;gap:8px;max-height:286px;overflow:hidden}
  .roulette-item{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.08)}
  .roulette-dot{width:10px;height:10px;border-radius:50%}.roulette-name{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.roulette-meta{opacity:.86;font-variant-numeric:tabular-nums;font-weight:700}
  @media(max-width:760px){.roulette-layout{grid-template-columns:1fr}.wheel-box{width:min(58vw,300px)}.poll-row{grid-template-columns:1fr auto}.poll-track{grid-column:1/3}.roulette-list{max-height:180px}}
  .timer-wrap{
    position:relative;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;max-width:94vw;padding:24px 34px;box-sizing:border-box;transition:filter .25s ease;
    background:transparent!important;border:none!important;outline:none!important;box-shadow:none!important;
  }
  #title{max-width:90vw;text-align:center;font-size:clamp(24px,2.6vw,54px);font-weight:800;line-height:1.08;letter-spacing:.055em;overflow-wrap:anywhere;background:transparent;border:0;outline:0}
  #title.hidden,#rate.hidden{display:none}
  #timer{font-size:clamp(64px,8vw,180px);font-weight:800;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap;background:transparent;border:0;outline:0}
  #rate{font-size:clamp(20px,2vw,40px);font-weight:650;padding:7px 15px;white-space:nowrap}
  #paused{position:absolute;top:-6px;left:50%;transform:translate(-50%,-100%);font-size:clamp(14px,1.2vw,24px);font-weight:850;letter-spacing:.18em;opacity:0;transition:opacity .2s ease;background:transparent;border:0;outline:0}
  #paused.visible{opacity:.95}

  /* 1 — CLASSIC: clean, universally readable */
  .theme-classic #title{color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.76)}
  .theme-classic #timer{color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.78),0 0 2px rgba(0,0,0,.95)}
  .theme-classic #rate{color:#fff;background:rgba(12,15,22,.58);border:0;border-radius:999px;backdrop-filter:blur(9px);text-shadow:0 2px 8px rgba(0,0,0,.58)}
  .theme-classic #paused{color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.72)}

  /* 2 — NEON: cyan/violet glow, no enclosing rectangle */
  .theme-neon #title{color:#79f7ff;text-transform:uppercase;text-shadow:0 0 8px rgba(121,247,255,.98),0 0 25px rgba(189,131,255,.66),0 3px 12px rgba(0,0,0,.9)}
  .theme-neon #timer{color:#bfffff;text-shadow:0 0 5px #79f7ff,0 0 20px rgba(121,247,255,.92),0 0 48px rgba(189,131,255,.58),0 4px 18px rgba(0,0,0,.95)}
  .theme-neon #rate{color:#f4eeff;background:rgba(24,18,45,.62);border:0;border-radius:999px;box-shadow:0 0 22px rgba(121,247,255,.18);text-shadow:0 0 8px rgba(189,131,255,.42)}
  .theme-neon #paused{color:#d0a6ff;text-shadow:0 0 12px rgba(189,131,255,.95)}

  /* 3 — PIXEL ARCADE: blocky arcade typography and hard offset shadows */
  .theme-minimal{font-family:Consolas,"Courier New",monospace;gap:10px}
  .theme-minimal #title{color:#f9f871;text-transform:uppercase;font-weight:900;letter-spacing:.12em;text-shadow:3px 3px 0 #7138d8,6px 6px 0 rgba(0,0,0,.9)}
  .theme-minimal #timer{color:#9cff57;font-weight:900;letter-spacing:.075em;text-shadow:4px 4px 0 #1f6b55,8px 8px 0 rgba(0,0,0,.88)}
  .theme-minimal #rate{color:#11151d;background:#f9f871;border:0;border-radius:0;font-weight:900;text-transform:uppercase;box-shadow:5px 5px 0 #7138d8,9px 9px 0 rgba(0,0,0,.46);text-shadow:none}
  .theme-minimal #paused{color:#ff5c8a;text-shadow:3px 3px 0 #2d1b50,6px 6px 0 rgba(0,0,0,.75)}

  /* 4 — RETRO: amber terminal look without the previous outer box */
  .theme-retro{font-family:Consolas,"Courier New",monospace;gap:9px}
  .theme-retro #title{color:#ffd76a;text-transform:uppercase;font-weight:700;letter-spacing:.08em;text-shadow:0 0 9px rgba(255,184,74,.55),0 3px 10px rgba(0,0,0,.95)}
  .theme-retro #timer{color:#ffd76a;font-weight:700;letter-spacing:.035em;text-shadow:0 0 5px rgba(255,215,106,.9),0 0 18px rgba(255,184,74,.52),0 3px 10px rgba(0,0,0,.95)}
  .theme-retro #rate{color:#ffd76a;background:rgba(38,27,8,.62);border:0;border-radius:4px;text-shadow:0 0 8px rgba(255,184,74,.38);box-shadow:inset 0 -2px 0 rgba(255,215,106,.5)}
  .theme-retro #paused{color:#ffb84a;text-shadow:0 0 9px rgba(255,184,74,.72)}

  /* 5 — HOLOGRAPHIC: iridescent gradient text with a clean luminous rate badge */
  .theme-glass #title{font-weight:850;letter-spacing:.065em;background:linear-gradient(90deg,#8ff7ff,#d5a8ff,#ffb7dc,#fff0a6,#8ff7ff);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 8px rgba(0,0,0,.72))}
  .theme-glass #timer{font-weight:900;letter-spacing:.03em;background:linear-gradient(90deg,#72e8ff 0%,#c6a2ff 28%,#ff9ed2 52%,#ffe796 75%,#79f4dc 100%);background-size:180% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 5px 12px rgba(0,0,0,.78)) drop-shadow(0 0 16px rgba(172,174,255,.32))}
  .theme-glass #rate{color:#171522;background:linear-gradient(90deg,#8ff7ff,#d7b0ff,#ffb7dc,#ffe79a);border:0;border-radius:999px;font-weight:850;box-shadow:0 8px 28px rgba(125,118,225,.25);text-shadow:none}
  .theme-glass #paused{color:#ffd0ef;text-shadow:0 0 14px rgba(255,143,217,.72),0 3px 10px rgba(0,0,0,.75)}

  /* 6 — CYBER: sharp cyan/magenta HUD typography, no enclosing HUD frame */
  .theme-cyber{font-family:"Segoe UI",Arial,sans-serif;gap:8px}
  .theme-cyber #title{color:#66f7ff;text-transform:uppercase;font-style:italic;letter-spacing:.11em;text-shadow:3px 0 0 rgba(255,62,191,.55),0 0 15px rgba(52,238,255,.55),0 3px 12px #000}
  .theme-cyber #timer{color:#ecffff;font-weight:900;font-style:italic;letter-spacing:.055em;text-shadow:4px 0 0 rgba(255,48,180,.54),-2px 0 0 rgba(41,238,255,.72),0 0 20px rgba(41,238,255,.48),0 5px 16px #000}
  .theme-cyber #rate{color:#08131a;background:linear-gradient(90deg,#58f5ff,#f46de2);border:0;border-radius:3px;font-weight:850;text-transform:uppercase;box-shadow:0 5px 20px rgba(0,0,0,.35)}
  .theme-cyber #paused{color:#ff6fd6;text-shadow:0 0 12px rgba(255,71,198,.9)}

  /* 7 — STREAMER: soft modern gradient-like stream package */
  .theme-streamer #title{color:#f7f4ff;font-weight:750;letter-spacing:.025em;text-shadow:0 3px 14px rgba(0,0,0,.72),0 0 20px rgba(142,104,255,.35)}
  .theme-streamer #timer{color:#fff;font-weight:850;text-shadow:0 5px 20px rgba(0,0,0,.72),0 0 26px rgba(116,103,240,.42)}
  .theme-streamer #rate{color:#fff;background:linear-gradient(90deg,rgba(101,87,232,.86),rgba(207,86,190,.82));border:0;border-radius:999px;font-weight:750;box-shadow:0 9px 24px rgba(40,28,84,.32)}
  .theme-streamer #paused{color:#e9dfff;text-shadow:0 0 12px rgba(155,115,255,.75)}

  /* 8 — GAMING BOLD: aggressive esports lettering, clearly distinct from classic */
  .theme-gaming{font-family:Impact,"Arial Black","Segoe UI",sans-serif;gap:9px}
  .theme-gaming #title{color:#f7d348;text-transform:uppercase;font-style:italic;font-weight:900;letter-spacing:.075em;transform:skewX(-5deg);-webkit-text-stroke:1.5px #161820;text-shadow:4px 4px 0 #e54858,8px 8px 0 rgba(0,0,0,.72)}
  .theme-gaming #timer{color:#ffffff;font-style:italic;font-weight:950;letter-spacing:.045em;transform:skewX(-5deg);-webkit-text-stroke:2.5px #11141b;text-shadow:5px 5px 0 #e54858,10px 10px 0 rgba(0,0,0,.75)}
  .theme-gaming #rate{color:#11131a;background:#f7d348;border:0;border-radius:5px;font-family:"Arial Black","Segoe UI",sans-serif;font-weight:900;text-transform:uppercase;box-shadow:6px 6px 0 #e54858,10px 10px 0 rgba(0,0,0,.4)}
  .theme-gaming #paused{color:#f7d348;font-family:"Arial Black","Segoe UI",sans-serif;text-shadow:3px 3px 0 #e54858,6px 6px 0 rgba(0,0,0,.7)}

  /* 9 — VAPORWAVE: pink/cyan synthwave with hard offset shadows instead of neon glow */
  .theme-elegant{font-family:"Arial Black","Segoe UI",sans-serif;gap:10px}
  .theme-elegant #title{color:#ff9bd6;text-transform:uppercase;font-style:italic;font-weight:900;letter-spacing:.09em;text-shadow:3px 3px 0 #49e8ff,7px 7px 0 #6a32a8,10px 10px 16px rgba(0,0,0,.58)}
  .theme-elegant #timer{color:#ffe4f6;font-weight:950;font-style:italic;letter-spacing:.035em;text-shadow:5px 5px 0 #48e6ff,10px 10px 0 #8d3ac4,14px 14px 22px rgba(0,0,0,.55)}
  .theme-elegant #rate{color:#fff0fb;background:linear-gradient(90deg,#7b2cbf,#d448b0);border:0;border-radius:3px;font-weight:850;letter-spacing:.045em;box-shadow:5px 5px 0 #43dff0,9px 9px 0 rgba(0,0,0,.36);text-shadow:0 2px 6px rgba(0,0,0,.42)}
  .theme-elegant #paused{color:#58edff;text-shadow:3px 3px 0 #a037c6,0 3px 12px rgba(0,0,0,.65)}

  /* 10 — COMIC POP: loud pop-art lettering with ink outline and offset colors */
  .theme-scoreboard{font-family:"Arial Black","Segoe UI",sans-serif;gap:9px}
  .theme-scoreboard #title{color:#ffea4d;text-transform:uppercase;font-weight:950;letter-spacing:.045em;transform:rotate(-1deg);-webkit-text-stroke:2px #10131a;text-shadow:5px 5px 0 #ff4f8b,9px 9px 0 #3bc9ff,12px 12px 0 rgba(0,0,0,.5)}
  .theme-scoreboard #timer{color:#ffffff;font-weight:950;letter-spacing:.02em;-webkit-text-stroke:3px #10131a;text-shadow:6px 6px 0 #3bc9ff,11px 11px 0 #ff4f8b,15px 15px 0 rgba(0,0,0,.48)}
  .theme-scoreboard #rate{color:#10131a;background:#52e2ff;border:3px solid #10131a;border-radius:4px;font-weight:950;text-transform:uppercase;transform:rotate(1deg);box-shadow:6px 6px 0 #ffea4d,10px 10px 0 #ff4f8b;text-shadow:none}
  .theme-scoreboard #paused{color:#ffea4d;-webkit-text-stroke:1px #10131a;text-shadow:4px 4px 0 #ff4f8b,7px 7px 0 rgba(0,0,0,.55)}
</style>
</head>
<body>
<div class="stage">
  <div id="interactive"></div>
  <div class="timer-wrap theme-classic" id="timerWrap">
    <div id="paused">ПАУЗА</div>
    <div id="title" class="hidden"></div>
    <div id="timer">00:00:00</div>
    <div id="rate">100 ₽ = +5 мин</div>
  </div>
</div>
<script>
const PAGE_BUILD='__OVERLAY_BUILD__';
const THEMES=['classic','neon','minimal','retro','glass','cyber','streamer','gaming','elegant','scoreboard'];
let state=null;
let receivedAt=performance.now();
let reloadRequested=false;
let lastSpinNonce=-1;
let currentWheelRotation=0;
let lastEntertainmentSignature="";

function fmtDuration(sec){
  sec=Math.max(0,Math.ceil(sec));
  const days=Math.floor(sec/86400);sec%=86400;
  const h=Math.floor(sec/3600);sec%=3600;
  const m=Math.floor(sec/60);const s=sec%60;
  const hh=String(h).padStart(2,'0');
  const mm=String(m).padStart(2,'0');
  const ss=String(s).padStart(2,'0');
  return days>0?`${days}д ${hh}:${mm}:${ss}`:`${hh}:${mm}:${ss}`;
}
function fmtRate(seconds){
  if(seconds%60===0)return `${seconds/60} мин`;
  return `${seconds} сек`;
}
function formatMoney(x){
  const n=Number(x);
  return Number.isInteger(n)?String(n):n.toFixed(2).replace(/\.00$/,'');
}
function requestFreshOverlay(build){
  if(reloadRequested)return;
  reloadRequested=true;
  const url=new URL(location.href);
  url.searchParams.set('v',build||Date.now().toString());
  url.searchParams.set('_refresh',Date.now().toString());
  location.replace(url.toString());
}
function applyAppearance(){
  if(!state)return;
  const wrap=document.getElementById('timerWrap');
  const title=document.getElementById('title');
  const rate=document.getElementById('rate');
  const theme=THEMES.includes(state.overlay_theme)?state.overlay_theme:'classic';
  wrap.className=`timer-wrap theme-${theme}`;
  const titleText=String(state.overlay_title||'').trim();
  title.textContent=titleText;
  title.classList.toggle('hidden',!titleText);
  rate.classList.toggle('hidden',state.overlay_show_rate===false);
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderEntertainment(){
  const host=document.getElementById('interactive');
  const e=state?.entertainment||{};
  const theme=THEMES.includes(state?.overlay_theme)?state.overlay_theme:'classic';
  const kind=e.display_type;
  const timerWrap=document.getElementById('timerWrap');
  timerWrap.style.display=e.timer_visible?'flex':'none';
  // An unrelated timer toggle or poll update must NOT rebuild the spinning wheel.
  const relevant = kind==='roulette' ? e.roulette : kind==='poll' ? e.poll : null;
  const signature=JSON.stringify({kind,relevant,theme});
  if(signature===lastEntertainmentSignature)return;
  lastEntertainmentSignature=signature;
  if(!kind){host.className='';host.innerHTML='';return;}
  if(kind==='poll'){
    const p=e.poll||{}; const rows=p.results||[]; const total=Number(p.total_votes)||0;
    host.className=`visible theme-${theme}`;
    const winner=Math.max(-1,...rows.map((x,i)=>({i,v:Number(x.votes)||0})).sort((a,b)=>b.v-a.v).slice(0,1).map(x=>x.i));
    host.innerHTML=`<div class="interactive-card"><div class="interactive-title">${esc(p.question||'Голосование')}</div>${rows.map((x,i)=>`<div class="poll-row"><div class="poll-label">${i+1}. ${esc(x.label)}</div><div class="poll-track"><div class="poll-fill" style="width:${Number(x.percent)||0}%;background:${x.color||'#8b5cf6'}"></div></div><div class="poll-value">${(Number(x.percent)||0).toFixed(0)}% · ${Number(x.votes)||0}</div></div>`).join('')}<div class="poll-footer">${p.active?'ГОЛОСОВАНИЕ ИДЁТ':'ГОЛОСОВАНИЕ ЗАВЕРШЕНО'} · ${total} голосов</div></div>`;
    return;
  }
  if(kind==='roulette'){
    const r=e.roulette||{}; const entries=r.entries||[]; const totalCount=Number(r.count)||entries.length;
    let cursor=0; const stops=[];
    if(entries.length){entries.forEach((x,i)=>{const a=cursor;cursor+=Number(x.percent)||0;stops.push(`${x.color||'#64748b'} ${a}% ${cursor}%`);});}
    const gradient=stops.length?`conic-gradient(${stops.join(',')})`:'#1f2937';
    const list=entries.slice(0,10).map(x=>`<div class="roulette-item"><span class="roulette-dot" style="background:${x.color}"></span><span class="roulette-name">${esc(x.label)}</span><span class="roulette-meta">${r.mode==='donation'?`${Number(x.weight||0).toLocaleString('ru-RU',{maximumFractionDigits:2})} ₽ · `:''}${(Number(x.percent)||0).toFixed(1)}%</span></div>`).join('');
    const more=totalCount>10?`<div class="poll-footer">и ещё ${totalCount-10} участников / вариантов</div>`:'';
    // Labels are CHILDREN of the rotor: they must share its rotation with the sectors.
    const diameter=window.innerWidth<=760?Math.min(window.innerWidth*.58,300):Math.min(window.innerWidth*.34,370);
    const labelRadius=Math.max(30,diameter*.33);
    let cursorPct=0;
    const labels=entries.slice(0,14).map((x)=>{
      const pct=Number(x.percent)||0;
      const mid=cursorPct+pct/2; cursorPct+=pct;
      if(pct<7.0)return '';
      const angle=mid*3.6;
      return `<div class="wheel-segment-label" style="transform:translate(-50%,-50%) rotate(${angle}deg) translateY(-${labelRadius}px) rotate(${-angle}deg);">${esc(String(x.label||'').slice(0,16))}</div>`;
    }).join('');
    const resultText = r.spinning
      ? `<div class="roulette-status">КОЛЕСО КРУТИТСЯ…</div><div class="roulette-result">?</div>`
      : r.result
        ? `<div class="roulette-result-box"><div class="roulette-status">${esc(r.result_status||'')}</div><div class="roulette-result">${esc(r.result)}</div></div>`
        : `<div class="roulette-status">${esc(r.result_status|| (r.collecting?'ИДЁТ СБОР':'ГОТОВО К ПРОКРУТКЕ'))}</div><div class="roulette-result">${esc(r.mode==='chat'?`${totalCount} участников`:r.mode==='donation'?`${totalCount} вариантов`:'Выбери победителя')}</div>`;
    host.className=`visible theme-${theme}`;
    host.innerHTML=`<div class="interactive-card"><div class="interactive-title">${esc(r.title||'Рулетка')}</div><div class="roulette-layout"><div class="wheel-box"><div class="wheel-pointer"></div><div id="wheel-rotor"><div id="wheel" style="background:${gradient}"></div><div class="wheel-labels">${labels}</div></div><div class="wheel-center">GO</div></div><div class="roulette-side">${resultText}<div class="roulette-list">${list}</div>${more}</div></div></div>`;
    const rotor=document.getElementById('wheel-rotor');
    const nonce=Number(r.spin_nonce)||0;
    if(rotor){
      const duration=(r.spin_speed==='fast'?1.6:6.2);
      if(lastSpinNonce<0){
        currentWheelRotation=Number(r.spin_angle)||0;
        rotor.style.transition='none';
        rotor.style.transform=`rotate(${currentWheelRotation}deg)`;
        void rotor.offsetWidth;
      } else if(nonce!==lastSpinNonce){
        const target=Number(r.spin_angle)||0;
        const mod=((currentWheelRotation%360)+360)%360;
        const turns=(r.spin_speed==='fast'?3:7);
        const startRotation=currentWheelRotation;
        const delta=turns*360+((target-mod+360)%360);
        const endRotation=startRotation+delta;
        rotor.style.transition='none';
        rotor.style.transform=`rotate(${startRotation}deg)`;
        void rotor.offsetWidth;
        // Two committed frames ensure OBS Chromium actually starts the animation.
        requestAnimationFrame(()=>requestAnimationFrame(()=>{
          rotor.style.transition=`transform ${duration}s cubic-bezier(.07,.69,.1,1)`;
          rotor.style.transform=`rotate(${endRotation}deg)`;
        }));
        currentWheelRotation=endRotation;
      } else {
        rotor.style.transition='none';
        rotor.style.transform=`rotate(${currentWheelRotation}deg)`;
      }
    }
    lastSpinNonce=nonce;
  }
}
function render(){
  if(!state)return;
  let remaining=Number(state.remaining_seconds)||0;
  if(state.running)remaining-=(performance.now()-receivedAt)/1000;
  document.getElementById('timer').textContent=fmtDuration(remaining);
  document.getElementById('rate').textContent=`${formatMoney(state.rate_amount)} ₽ = +${fmtRate(Number(state.rate_seconds)||0)}`;
  document.getElementById('paused').classList.toggle('visible',!state.running&&remaining>0);
}
async function sync(){
  try{
    const res=await fetch('/api/state?_='+Date.now(),{cache:'no-store'});
    if(!res.ok)return;
    const next=await res.json();
    if(next.overlay_build&&next.overlay_build!==PAGE_BUILD){requestFreshOverlay(next.overlay_build);return;}
    state=next;
    receivedAt=performance.now();
    applyAppearance();
    renderEntertainment();
    render();
  }catch(_){ }
}
setInterval(render,100);
setInterval(sync,500);
sync();
</script>
</body>
